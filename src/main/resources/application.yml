spring:
  application:
    name: bankalite
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/bankalite
    username: bank
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7

server:
  port: 8080